# Cloudflare wiring plus shared, non-secret settings.
# Per-environment values (JWT_SECRET, ALLOWED_ORIGINS, PUBLIC_BASE_URL, WORKER_DOMAIN) are NOT here:
#   - locally they come from .env
#   - in CI they come from GitHub environment secrets/variables (see .github/workflows/deploy.yml)
#
# Top level = dev (branch dev-server). [env.production] = production (branch production).
# Wrangler does not copy vars or bindings into [env.*], so production repeats them.

name = "mulearn-media-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# ---------------- dev ----------------
# The worker's custom domain is not set here: it is passed at deploy time with
# --domain, from WORKER_DOMAIN (.env locally, GitHub variable in CI).

# Runs the cleanup once a day (UTC).
[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mulearn-media"

[images]
binding = "IMAGES"

[vars]
WEBP_QUALITY = 85
CACHE_CONTROL = "public, max-age=31536000, immutable"
# module -> R2 folder, max input size (bytes), max width/height (px).
# Keep the names and folders in sync with the backend's utils/media_modules.py.
MEDIA_MODULES = '{"ig_cover":{"folder":"interest_group/cover","maxBytes":5242880,"maxDimension":2000},"ig_icon":{"folder":"interest_group/icon","maxBytes":5242880,"maxDimension":512}}'

# Daily cleanup of images that no record uses (see src/cleanup.ts).
# BACKEND_URL and BACKEND_API_KEY are per-environment values, set like JWT_SECRET.
CLEANUP_GRACE_HOURS = 24      # never touch images younger than this
CLEANUP_MAX_DELETES = 1000    # safety limit per run
CLEANUP_DRY_RUN = true        # true = only log what would be deleted; set false to really delete

# ---------------- production ----------------
[env.production]
name = "mulearn-media-worker-prod"

[env.production.triggers]
crons = ["0 3 * * *"]

[[env.production.r2_buckets]]
binding = "BUCKET"
# TODO(production): create this bucket (or replace the name) before the first production deploy.
bucket_name = "mulearn-media-prod"

[env.production.images]
binding = "IMAGES"

[env.production.vars]
WEBP_QUALITY = 85
CACHE_CONTROL = "public, max-age=31536000, immutable"
MEDIA_MODULES = '{"ig_cover":{"folder":"interest_group/cover","maxBytes":5242880,"maxDimension":2000},"ig_icon":{"folder":"interest_group/icon","maxBytes":5242880,"maxDimension":512}}'

# Daily cleanup of images that no record uses (see src/cleanup.ts).
# BACKEND_URL and BACKEND_API_KEY are per-environment values, set like JWT_SECRET.
CLEANUP_GRACE_HOURS = 24      # never touch images younger than this
CLEANUP_MAX_DELETES = 1000    # safety limit per run
CLEANUP_DRY_RUN = true        # true = only log what would be deleted; set false to really delete
