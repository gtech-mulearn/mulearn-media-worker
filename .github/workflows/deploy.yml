name: Worker CI/CD

# dev-server branch  -> dev worker        (wrangler.toml top level)
# production branch  -> production worker ([env.production] in wrangler.toml)
# Pull requests into either branch only run the checks.

on:
  push:
    branches: [dev-server, production]
  pull_request:
    branches: [dev-server, production]
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy (${{ github.ref_name }})
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == 'dev-server' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    # GitHub environments "dev" and "production" hold that environment's secrets/variables.
    environment: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Per-environment values go up as Worker secrets. Written as JSON (not .env)
      # so characters like # " $ in the secret are passed through unchanged.
      - name: Build secrets file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          # Optional: only needed for the daily cleanup of unused images.
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          for v in JWT_SECRET ALLOWED_ORIGINS PUBLIC_BASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set for this environment"; exit 1; fi
          done
          umask 077
          # Empty optional values are left out of the file.
          jq -n --arg a "$JWT_SECRET" --arg b "$ALLOWED_ORIGINS" --arg c "$PUBLIC_BASE_URL" \
                --arg d "$BACKEND_URL" --arg e "$BACKEND_API_KEY" \
            '{JWT_SECRET: $a, ALLOWED_ORIGINS: $b, PUBLIC_BASE_URL: $c, BACKEND_URL: $d, BACKEND_API_KEY: $e}
             | with_entries(select(.value != ""))' > secrets.json
          if [ -z "$BACKEND_URL" ] || [ -z "$BACKEND_API_KEY" ]; then
            echo "::warning::BACKEND_URL / BACKEND_API_KEY not set: cleanup of unused images is off"
          fi

      # The worker's custom domain comes from the WORKER_DOMAIN variable, not wrangler.toml.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
          TARGET_ENV: ${{ github.ref_name == 'production' && 'production' || '' }}
        run: |
          if [ -z "$WORKER_DOMAIN" ]; then echo "::error::WORKER_DOMAIN is not set for this environment"; exit 1; fi
          npx wrangler deploy --env "$TARGET_ENV" --domain "$WORKER_DOMAIN" --secrets-file secrets.json

      - name: Remove secrets file
        if: always()
        run: rm -f secrets.json
